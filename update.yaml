---
- name: MikroTik RouterOS and RouterBOARD update
  hosts: mikrotik
  gather_facts: no
  serial: 1  # Serial execution to avoid PoE-related outages of dependent devices

  tasks:
    # --- RouterOS update ---

    - name: Trigger RouterOS update check (returns immediately)
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system package update check-for-updates once'
      register: ros_update_trigger
      changed_when: false
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: Poll RouterOS update status until the check has finished
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system package update print'
      register: ros_update_check
      until:
        - "'status:' in ros_update_check.stdout"
        - "'finding out latest version' not in (ros_update_check.stdout | lower)"
      retries: 20
      delay: 3
      changed_when: false
      check_mode: false
      delegate_to: localhost

    - name: Show RouterOS update status
      ansible.builtin.debug:
        msg: "{{ ros_update_check.stdout_lines | default([]) }}"

    - name: Determine whether a RouterOS update is available
      ansible.builtin.set_fact:
        ros_update_available: >-
          {{
            ('new version is available' in (ros_update_check.stdout | default('') | lower))
            and ('could not' not in (ros_update_check.stdout | default('') | lower))
          }}

    - name: Show decision for RouterOS update
      ansible.builtin.debug:
        msg: "RouterOS update available: {{ ros_update_available }}"

    - name: Install RouterOS update if a new version is available
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system package update install'
      when: ros_update_available | bool
      register: ros_update_install
      delegate_to: localhost
      no_log: true

    - name: Wait until SSH port closes (reboot started after RouterOS update)
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port }}"
        state: stopped
        delay: 5
        timeout: 60
      when: ros_update_install is changed
      delegate_to: localhost
      ignore_errors: true

    - name: Wait until SSH port is back (RouterOS update finished)
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port }}"
        state: started
        delay: 5
        timeout: 300
      when: ros_update_install is changed
      delegate_to: localhost

    - name: Wait until RouterOS is really usable after RouterOS update
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5
        -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system identity print'
      register: ros_ready
      until: ros_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: ros_update_install is changed
      delegate_to: localhost
      no_log: true

    # --- RouterBOARD firmware update ---

    - name: Read RouterBOARD firmware information (fails gracefully on x86)
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system routerboard print'
      register: rb_firmware_info
      changed_when: false
      failed_when: false
      check_mode: false
      delegate_to: localhost

    - name: Determine whether the device has a RouterBOARD (x86 does not)
      ansible.builtin.set_fact:
        has_routerboard: "{{ 'current-firmware' in (rb_firmware_info.stdout | default('')) }}"

    - name: Extract current and upgrade RouterBOARD firmware versions
      ansible.builtin.set_fact:
        rb_current_fw: >-
          {{ (rb_firmware_info.stdout | default(''))
             | regex_findall('current-firmware[:] (.*)')
             | first | default('', true) | trim }}
        rb_upgrade_fw: >-
          {{ (rb_firmware_info.stdout | default(''))
             | regex_findall('upgrade-firmware[:] (.*)')
             | first | default('', true) | trim }}

    - name: Show RouterBOARD firmware state
      ansible.builtin.debug:
        msg:
          has_routerboard: "{{ has_routerboard }}"
          current_firmware: "{{ rb_current_fw | default('') }}"
          upgrade_firmware: "{{ rb_upgrade_fw | default('') }}"
          upgrade_needed: >-
            {{
              has_routerboard | bool
              and rb_current_fw | length > 0
              and rb_upgrade_fw | length > 0
              and rb_current_fw != rb_upgrade_fw
            }}

    - name: Skip RouterBOARD firmware update on x86 builds
      ansible.builtin.debug:
        msg: "No RouterBOARD detected (e.g. x86 build) - skipping firmware update."
      when: not has_routerboard

    - name: Stage RouterBOARD firmware upgrade when it differs
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system routerboard upgrade'
      when:
        - has_routerboard
        - rb_current_fw | length > 0
        - rb_upgrade_fw | length > 0
        - rb_current_fw != rb_upgrade_fw
      register: rb_firmware_upgrade
      delegate_to: localhost
      no_log: true

    - name: Reboot device to apply RouterBOARD firmware
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system reboot'
      when:
        - rb_firmware_upgrade is defined
        - rb_firmware_upgrade is changed
      register: rb_reboot
      failed_when: false
      delegate_to: localhost
      no_log: true

    - name: Wait until SSH port closes (reboot started after RouterBOARD update)
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port }}"
        state: stopped
        delay: 5
        timeout: 60
      when:
        - rb_reboot is defined
        - rb_reboot is changed
      delegate_to: localhost
      ignore_errors: true

    - name: Wait until SSH port is back (RouterBOARD update finished)
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: "{{ ansible_port }}"
        state: started
        delay: 5
        timeout: 300
      when:
        - rb_reboot is defined
        - rb_reboot is changed
      delegate_to: localhost

    - name: Wait until RouterOS is really usable after RouterBOARD update
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5
        -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system identity print'
      register: rb_ready
      until: rb_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when:
        - rb_reboot is defined
        - rb_reboot is changed
      delegate_to: localhost
      no_log: true

    # --- Final verification ---

    - name: Read current RouterOS version
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system resource print'
      register: ros_version_check
      changed_when: false
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: Read current RouterBOARD firmware (fails gracefully on x86)
      ansible.builtin.command: >
        sshpass -p '{{ ansible_ssh_pass }}'
        ssh -o StrictHostKeyChecking=no -p {{ ansible_port }} {{ ansible_user }}@{{ inventory_hostname }}
        '/system routerboard print'
      register: rb_firmware_check
      changed_when: false
      failed_when: false
      check_mode: false
      delegate_to: localhost
      no_log: true

    - name: Extract final versions
      ansible.builtin.set_fact:
        final_ros_version: >-
          {{ (ros_version_check.stdout | default(''))
             | regex_findall('version[:] (.*)')
             | first | default('unknown', true) | trim }}
        final_rb_version: >-
          {{ (rb_firmware_check.stdout | default(''))
             | regex_findall('current-firmware[:] (.*)')
             | first | default('unknown', true) | trim }}

    - name: Show final result
      ansible.builtin.debug:
        msg:
          RouterOS: "{{ final_ros_version }}"
          RouterBOARD: >-
            {{
              has_routerboard | bool
              | ternary(final_rb_version, 'not applicable (no RouterBOARD / x86)')
            }}
